<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ルパンタイトルメーカー</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:-apple-system,sans-serif}.w{max-width:680px;margin:auto;padding:34px 18px}h1{margin:0 0 5px;white-space:nowrap;font-size:clamp(22px,7vw,32px);letter-spacing:-.04em}.v,.note{color:#888;font-size:12px}.v{margin-bottom:28px}textarea{width:100%;height:120px;background:#171717;color:#fff;border:1px solid #444;border-radius:12px;padding:14px;font-size:20px}.photo{margin-top:12px;padding:12px;background:#171717;border:1px solid #333;border-radius:12px}.photo label{display:block;font-weight:700;margin-bottom:8px}.photo input{width:100%}.preview{display:none;margin-top:10px;max-width:100%;max-height:220px;border-radius:10px}.make{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;font-size:17px;font-weight:bold}.item{background:#171717;border:1px solid #333;border-radius:12px;padding:14px;margin:10px 0}.txt{white-space:pre-wrap;font-family:serif;font-size:18px;margin-bottom:11px}.a{display:flex;gap:8px;flex-wrap:wrap}.a button{border:0;border-radius:8px;padding:10px;background:#333;color:#fff}.del{color:#ff8080!important}</style></head><body><main class="w"><h1>ルパンタイトルメーカー</h1><div class="v">Version 3.5</div><textarea id="t" placeholder="タイトルを入力"></textarea><div class="photo"><label for="photo">写真を追加（任意）</label><input id="photo" type="file" accept="image/*"><img id="preview" class="preview" alt=""></div><button class="make" id="m">作成・保存</button><h2>保存したタイトル</h2><div id="l"></div><p class="note">短いリンク /t/xxxxxxx を発行します。</p></main><script>
const K="lupin-admin-v12",t=document.querySelector("#t"),l=document.querySelector("#l"),m=document.querySelector("#m"),photo=document.querySelector("#photo"),preview=document.querySelector("#preview"),load=()=>JSON.parse(localStorage.getItem(K)||"[]"),save=a=>localStorage.setItem(K,JSON.stringify(a)),link=id=>location.origin+"/t/"+id;

async function photoData(file){
 if(!file)return null;
 const bmp=await createImageBitmap(file),max=1100,scale=Math.min(1,max/Math.max(bmp.width,bmp.height));
 const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*scale);cv.height=Math.round(bmp.height*scale);
 cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
 return cv.toDataURL("image/jpeg",.78);
}
photo.onchange=()=>{const f=photo.files?.[0];if(!f){preview.style.display="none";return}preview.src=URL.createObjectURL(f);preview.style.display="block"};

async function api(p,o={}){let r=await fetch(p,{headers:{"content-type":"application/json"},...o}),j=await r.json();if(!r.ok)throw Error(j.error);return j}
function render(){let a=load();l.innerHTML=a.length?"":"まだありません。";a.forEach((x,i)=>{let d=document.createElement("div");d.className="item";let q=document.createElement("div");q.className="txt";q.textContent=x.title;d.append(q);let b=document.createElement("div");b.className="a";b.innerHTML='<button class="p">再生</button><button class="e">編集</button><button class="c">リンクコピー</button><button class="del">削除</button>';d.append(b);b.querySelector(".p").onclick=()=>location.href=link(x.id)+"?admin=1";b.querySelector(".c").onclick=async()=>{await navigator.clipboard.writeText(link(x.id));alert("コピーしました")};b.querySelector(".e").onclick=async()=>{let n=prompt("編集",x.title);if(!n?.trim())return;await api("/api/titles/"+x.id,{method:"PUT",body:JSON.stringify({title:n})});x.title=n.trim();save(a);render()};b.querySelector(".del").onclick=async()=>{if(confirm("削除しますか？")){await api("/api/titles/"+x.id,{method:"DELETE"});a.splice(i,1);save(a);render()}};l.append(d)})}
m.onclick=async()=>{let x=t.value.trim();if(!x)return;try{
 m.disabled=true;m.textContent="保存中…";
 const image=await photoData(photo.files?.[0]);
 let j=await api("/api/titles",{method:"POST",body:JSON.stringify({title:x,image})}),a=load();
 a.unshift({id:j.id,title:j.title});save(a);t.value="";photo.value="";preview.style.display="none";render()
}catch(e){alert(e.message==="KV_NOT_BOUND"?"KVをまだ接続していません":e.message)}
finally{m.disabled=false;m.textContent="作成・保存"}};render();
</script></body></html>
