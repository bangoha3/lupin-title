<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ルパン・タイトル</title>

<style>

html,body{

  margin:0;

  padding:0;

  width:100%;

  height:100%;

  background:#000;

  overflow:hidden;

}

body{

  display:flex;

  justify-content:center;

  align-items:center;

  font-family:

    "Hiragino Mincho ProN",

    "Yu Mincho",

    serif;

  color:white;

  cursor:pointer;

  -webkit-user-select:none;

  user-select:none;

}

#screen{

  position:fixed;

  inset:0;

  background:#000;

  display:flex;

  justify-content:center;

  align-items:center;

}

#title{

  color:#fff;

  font-size:clamp(32px,8vw,90px);

  font-weight:900;

  line-height:1.45;

  letter-spacing:.05em;

  text-align:center;

  padding:30px;

  white-space:pre-wrap;

  text-shadow:

    0 0 2px #fff,

    2px 2px 0 #222;

}

#start{

  position:fixed;

  inset:0;

  display:flex;

  justify-content:center;

  align-items:center;

  color:#aaa;

  font-family:-apple-system,BlinkMacSystemFont,sans-serif;

  font-size:18px;

  letter-spacing:.15em;

}

.flash{

  animation:flash .18s ease-out;

}

@keyframes flash{

  0%{background:#fff;}

  100%{background:#000;}

}

</style>

</head>

<body>

<div id="screen">

  <div id="title"></div>

</div>

<div id="start">

  TAP TO START

</div>

<script>

const message = "誕生日月初日、\n太客あらわる！";

const title = document.getElementById("title");

const start = document.getElementById("start");

const screen = document.getElementById("screen");

let running = false;

let audioCtx;

function initAudio(){

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

}

function typeSound(){
  const t=audioCtx.currentTime;

  // Hard, dry typewriter-like pulse: noise transient + two narrow high partials.
  const n=Math.floor(audioCtx.sampleRate*.032);
  const buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++){
    const env=Math.exp(-i/(audioCtx.sampleRate*.0065));
    d[i]=(Math.random()*2-1)*env;
  }
  const noise=audioCtx.createBufferSource();
  const hp=audioCtx.createBiquadFilter();
  const ng=audioCtx.createGain();
  noise.buffer=buf;
  hp.type="bandpass"; hp.frequency.value=3100; hp.Q.value=1.7;
  ng.gain.setValueAtTime(.32,t);
  ng.gain.exponentialRampToValueAtTime(.001,t+.032);
  noise.connect(hp); hp.connect(ng); ng.connect(audioCtx.destination);
  noise.start(t); noise.stop(t+.034);

  [2650,3550].forEach((f,i)=>{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=i?"square":"sawtooth";
    o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(i?.055:.075,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.028);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t+.03);
  });
}

function finalSound(){
  const t=audioCtx.currentTime;
  const master=audioCtx.createGain();
  const comp=audioCtx.createDynamicsCompressor();
  master.gain.value=.82;
  master.connect(comp); comp.connect(audioCtx.destination);

  // "Gyaoon": distorted, descending brass/guitar-like sweep.
  const sweepGain=audioCtx.createGain();
  const sweepFilter=audioCtx.createBiquadFilter();
  sweepFilter.type="lowpass";
  sweepFilter.frequency.setValueAtTime(5200,t);
  sweepFilter.frequency.exponentialRampToValueAtTime(950,t+1.05);
  sweepGain.gain.setValueAtTime(.001,t);
  sweepGain.gain.linearRampToValueAtTime(.34,t+.018);
  sweepGain.gain.setValueAtTime(.34,t+.12);
  sweepGain.gain.exponentialRampToValueAtTime(.001,t+1.18);
  sweepFilter.connect(sweepGain); sweepGain.connect(master);

  [1,1.5,2.02].forEach((ratio,i)=>{
    const o=audioCtx.createOscillator();
    o.type=i===0?"sawtooth":"square";
    o.frequency.setValueAtTime(690*ratio,t);
    o.frequency.exponentialRampToValueAtTime(145*ratio,t+.92);
    o.detune.setValueAtTime((i-1)*8,t);
    o.connect(sweepFilter);
    o.start(t); o.stop(t+1.2);
  });

  // Low impact under the sweep.
  const bass=audioCtx.createOscillator(), bg=audioCtx.createGain();
  bass.type="sine";
  bass.frequency.setValueAtTime(118,t);
  bass.frequency.exponentialRampToValueAtTime(47,t+.55);
  bg.gain.setValueAtTime(.46,t);
  bg.gain.exponentialRampToValueAtTime(.001,t+.72);
  bass.connect(bg); bg.connect(master);
  bass.start(t); bass.stop(t+.75);

  // Two syncopated "cha-cha" brass stabs after the sweep.
  function stab(at, root, level){
    [1,1.26,1.5,2].forEach((r,i)=>{
      const o=audioCtx.createOscillator();
      const g=audioCtx.createGain();
      const f=audioCtx.createBiquadFilter();
      o.type=i<2?"square":"sawtooth";
      o.frequency.value=root*r;
      f.type="lowpass"; f.frequency.value=3000;
      g.gain.setValueAtTime(.001,at);
      g.gain.linearRampToValueAtTime(level/(i+1),at+.008);
      g.gain.exponentialRampToValueAtTime(.001,at+.17);
      o.connect(f); f.connect(g); g.connect(master);
      o.start(at); o.stop(at+.19);
    });
  }
  stab(t+1.18,220,.30);
  stab(t+1.43,247,.34);

  // Short metallic tail.
  const tail=audioCtx.createOscillator(), tg=audioCtx.createGain();
  tail.type="triangle";
  tail.frequency.setValueAtTime(740,t+1.43);
  tail.frequency.exponentialRampToValueAtTime(330,t+2.15);
  tg.gain.setValueAtTime(.11,t+1.43);
  tg.gain.exponentialRampToValueAtTime(.001,t+2.25);
  tail.connect(tg); tg.connect(master);
  tail.start(t+1.43); tail.stop(t+2.3);
}

function sleep(ms){

  return new Promise(resolve=>setTimeout(resolve,ms));

}

async function play(){

  if(running) return;

  running=true;

  start.style.display="none";

  title.textContent="";

  if(!audioCtx){

    initAudio();

  }

  if(audioCtx.state==="suspended"){

    await audioCtx.resume();

  }

  await sleep(450);

  for(const char of message){

    title.textContent += char;

    if(char!=="\n"){

      typeSound();

    }

    await sleep(100);

  }

  await sleep(180);

  screen.classList.add("flash");

  finalSound();

  setTimeout(()=>{

    screen.classList.remove("flash");

  },180);

  running=false;

}

document.body.addEventListener("click",play);

document.body.addEventListener("touchend",(e)=>{

  e.preventDefault();

  play();

},{passive:false});

</script>

</body>

</html>
