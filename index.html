<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ルパン・タイトル</title>

<style>

html,body{

  margin:0;

  padding:0;

  width:100%;

  height:100%;

  background:#000;

  overflow:hidden;

}

body{

  display:flex;

  justify-content:center;

  align-items:center;

  font-family:

    "Hiragino Mincho ProN",

    "Yu Mincho",

    serif;

  color:white;

  cursor:pointer;

  -webkit-user-select:none;

  user-select:none;

}

#screen{

  position:fixed;

  inset:0;

  background:#000;

  display:flex;

  justify-content:center;

  align-items:center;

}

#title{

  color:#fff;

  font-size:clamp(32px,8vw,90px);

  font-weight:900;

  line-height:1.45;

  letter-spacing:.05em;

  text-align:center;

  padding:30px;

  white-space:pre-wrap;

  text-shadow:

    0 0 2px #fff,

    2px 2px 0 #222;

}

#start{

  position:fixed;

  inset:0;

  display:flex;

  justify-content:center;

  align-items:center;

  color:#aaa;

  font-family:-apple-system,BlinkMacSystemFont,sans-serif;

  font-size:18px;

  letter-spacing:.15em;

}

.flash{

  animation:flash .18s ease-out;

}

@keyframes flash{

  0%{background:#fff;}

  100%{background:#000;}

}

</style>

</head>

<body>

<div id="screen">

  <div id="title"></div>

</div>

<div id="start">

  TAP TO START

</div>

<script>

const message = "誕生日月初日、\n太客あらわる！";

const title = document.getElementById("title");

const start = document.getElementById("start");

const screen = document.getElementById("screen");

let running = false;

let audioCtx;

function initAudio(){

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

}

function typeSound(){
  const now=audioCtx.currentTime;

  // Short, dry mechanical "type" hit: transient noise + low click.
  const len=Math.floor(audioCtx.sampleRate*.055);
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++){
    const env=Math.exp(-i/(audioCtx.sampleRate*.010));
    d[i]=(Math.random()*2-1)*env;
  }
  const noise=audioCtx.createBufferSource();
  noise.buffer=buf;
  const hp=audioCtx.createBiquadFilter();
  hp.type="highpass"; hp.frequency.value=850;
  const ng=audioCtx.createGain();
  ng.gain.setValueAtTime(.34,now);
  ng.gain.exponentialRampToValueAtTime(.001,now+.05);
  noise.connect(hp); hp.connect(ng); ng.connect(audioCtx.destination);
  noise.start(now); noise.stop(now+.055);

  const osc=audioCtx.createOscillator();
  const og=audioCtx.createGain();
  osc.type="square";
  osc.frequency.setValueAtTime(155,now);
  osc.frequency.exponentialRampToValueAtTime(90,now+.035);
  og.gain.setValueAtTime(.16,now);
  og.gain.exponentialRampToValueAtTime(.001,now+.045);
  osc.connect(og); og.connect(audioCtx.destination);
  osc.start(now); osc.stop(now+.05);
}

function finalSound(){
  const now=audioCtx.currentTime;

  // Original synthesized dramatic sting: brass-like chord, bass impact and decay.
  const master=audioCtx.createGain();
  master.gain.setValueAtTime(.72,now);
  master.gain.exponentialRampToValueAtTime(.001,now+1.45);
  master.connect(audioCtx.destination);

  const notes=[196,261.63,329.63,392];
  notes.forEach((freq,i)=>{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    const filter=audioCtx.createBiquadFilter();
    osc.type=i===0?"sawtooth":"square";
    osc.frequency.setValueAtTime(freq,now);
    osc.detune.value=(i-1.5)*4;
    filter.type="lowpass";
    filter.frequency.setValueAtTime(2600,now);
    filter.frequency.exponentialRampToValueAtTime(650,now+1.1);
    gain.gain.setValueAtTime(.001,now);
    gain.gain.linearRampToValueAtTime(i===0?.23:.13,now+.018);
    gain.gain.exponentialRampToValueAtTime(.001,now+1.25);
    osc.connect(filter); filter.connect(gain); gain.connect(master);
    osc.start(now); osc.stop(now+1.3);
  });

  // Low cinematic thump.
  const bass=audioCtx.createOscillator();
  const bg=audioCtx.createGain();
  bass.type="sine";
  bass.frequency.setValueAtTime(105,now);
  bass.frequency.exponentialRampToValueAtTime(42,now+.32);
  bg.gain.setValueAtTime(.55,now);
  bg.gain.exponentialRampToValueAtTime(.001,now+.55);
  bass.connect(bg); bg.connect(master);
  bass.start(now); bass.stop(now+.6);

  // Bright attack.
  const len=Math.floor(audioCtx.sampleRate*.11);
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(audioCtx.sampleRate*.022));
  const hit=audioCtx.createBufferSource(); hit.buffer=buf;
  const hp=audioCtx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1500;
  const hg=audioCtx.createGain(); hg.gain.value=.25;
  hit.connect(hp); hp.connect(hg); hg.connect(master);
  hit.start(now); hit.stop(now+.11);
}

function sleep(ms){

  return new Promise(resolve=>setTimeout(resolve,ms));

}

async function play(){

  if(running) return;

  running=true;

  start.style.display="none";

  title.textContent="";

  if(!audioCtx){

    initAudio();

  }

  if(audioCtx.state==="suspended"){

    await audioCtx.resume();

  }

  await sleep(450);

  for(const char of message){

    title.textContent += char;

    if(char!=="\n"){

      typeSound();

    }

    await sleep(92);

  }

  await sleep(180);

  screen.classList.add("flash");

  finalSound();

  setTimeout(()=>{

    screen.classList.remove("flash");

  },180);

  running=false;

}

document.body.addEventListener("click",play);

document.body.addEventListener("touchend",(e)=>{

  e.preventDefault();

  play();

},{passive:false});

</script>

</body>

</html>
