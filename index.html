<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ルパン・タイトル</title>

<style>

html,body{

  margin:0;

  padding:0;

  width:100%;

  height:100%;

  background:#000;

  overflow:hidden;

}

body{

  display:flex;

  justify-content:center;

  align-items:center;

  font-family:

    "Hiragino Mincho ProN",

    "Yu Mincho",

    serif;

  color:white;

  cursor:pointer;

  -webkit-user-select:none;

  user-select:none;

}

#screen{

  position:fixed;

  inset:0;

  background:#000;

  display:flex;

  justify-content:center;

  align-items:center;

}

#title{

  color:#fff;

  font-size:clamp(32px,8vw,90px);

  font-weight:900;

  line-height:1.45;

  letter-spacing:.05em;

  text-align:center;

  padding:30px;

  white-space:pre-wrap;

  text-shadow:

    0 0 2px #fff,

    2px 2px 0 #222;

}

#start{

  position:fixed;

  inset:0;

  display:flex;

  justify-content:center;

  align-items:center;

  color:#aaa;

  font-family:-apple-system,BlinkMacSystemFont,sans-serif;

  font-size:18px;

  letter-spacing:.15em;

}

.flash{

  animation:flash .18s ease-out;

}

@keyframes flash{

  0%{background:#fff;}

  100%{background:#000;}

}

</style>

</head>

<body>

<div id="screen">

  <div id="title"></div>

</div>

<div id="start">

  TAP TO START

</div>

<script>

const message = "誕生日月初日、\n太客あらわる！";

const title = document.getElementById("title");

const start = document.getElementById("start");

const screen = document.getElementById("screen");

let running = false;

let audioCtx;

function initAudio(){

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

}

function typeSound(){
  const t=audioCtx.currentTime;

  // Reference-video inspired: very short, bright, buzzy pulse centered around 3–4 kHz.
  const osc1=audioCtx.createOscillator();
  const osc2=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  const bp=audioCtx.createBiquadFilter();

  osc1.type="square";
  osc2.type="sawtooth";
  osc1.frequency.setValueAtTime(3230,t);
  osc2.frequency.setValueAtTime(3820,t);

  bp.type="bandpass";
  bp.frequency.value=3450;
  bp.Q.value=2.2;

  g.gain.setValueAtTime(.001,t);
  g.gain.linearRampToValueAtTime(.22,t+.002);
  g.gain.exponentialRampToValueAtTime(.001,t+.042);

  osc1.connect(bp);
  osc2.connect(bp);
  bp.connect(g);
  g.connect(audioCtx.destination);

  osc1.start(t); osc2.start(t);
  osc1.stop(t+.045); osc2.stop(t+.045);
}

function finalSound(){
  const t=audioCtx.currentTime;
  const master=audioCtx.createGain();
  const comp=audioCtx.createDynamicsCompressor();

  master.gain.setValueAtTime(.85,t);
  master.gain.setValueAtTime(.85,t+.18);
  master.gain.exponentialRampToValueAtTime(.001,t+2.85);
  master.connect(comp);
  comp.connect(audioCtx.destination);

  // Strong low/mid impact and a bright upper layer, modeled from the reference's spectrum.
  const voices=[
    [100,"sawtooth",.24],
    [200,"square",.17],
    [300,"sawtooth",.13],
    [500,"square",.10],
    [890,"sawtooth",.075],
    [1755,"square",.055],
    [2540,"sawtooth",.045]
  ];

  voices.forEach(([f,type,level],i)=>{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    const lp=audioCtx.createBiquadFilter();
    o.type=type;
    o.frequency.setValueAtTime(f,t);
    if(i<3) o.frequency.exponentialRampToValueAtTime(f*.86,t+2.4);
    lp.type="lowpass";
    lp.frequency.setValueAtTime(5200,t);
    lp.frequency.exponentialRampToValueAtTime(900,t+2.6);
    g.gain.setValueAtTime(.001,t);
    g.gain.linearRampToValueAtTime(level,t+.012);
    g.gain.exponentialRampToValueAtTime(.001,t+2.75);
    o.connect(lp); lp.connect(g); g.connect(master);
    o.start(t); o.stop(t+2.85);
  });

  // Noisy attack gives the final hit its sharp "snap".
  const n=.12*audioCtx.sampleRate|0;
  const buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++){
    d[i]=(Math.random()*2-1)*Math.exp(-i/(audioCtx.sampleRate*.018));
  }
  const noise=audioCtx.createBufferSource();
  const hp=audioCtx.createBiquadFilter();
  const ng=audioCtx.createGain();
  noise.buffer=buf;
  hp.type="highpass"; hp.frequency.value=1350;
  ng.gain.value=.22;
  noise.connect(hp); hp.connect(ng); ng.connect(master);
  noise.start(t); noise.stop(t+.12);
}

function sleep(ms){

  return new Promise(resolve=>setTimeout(resolve,ms));

}

async function play(){

  if(running) return;

  running=true;

  start.style.display="none";

  title.textContent="";

  if(!audioCtx){

    initAudio();

  }

  if(audioCtx.state==="suspended"){

    await audioCtx.resume();

  }

  await sleep(450);

  for(const char of message){

    title.textContent += char;

    if(char!=="\n"){

      typeSound();

    }

    await sleep(100);

  }

  await sleep(180);

  screen.classList.add("flash");

  finalSound();

  setTimeout(()=>{

    screen.classList.remove("flash");

  },180);

  running=false;

}

document.body.addEventListener("click",play);

document.body.addEventListener("touchend",(e)=>{

  e.preventDefault();

  play();

},{passive:false});

</script>

</body>

</html>
