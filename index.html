<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ルパン・タイトルメーカー</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:white;font-family:-apple-system,sans-serif}.w{max-width:680px;margin:auto;padding:34px 18px}h1{margin:0 0 5px;font-size:27px}.v,.note{color:#888;font-size:12px}.v{margin-bottom:28px}textarea{width:100%;height:120px;background:#171717;color:white;border:1px solid #444;border-radius:12px;padding:14px;font-size:20px}.make{width:100%;margin-top:12px;background:white;color:black;border:0;border-radius:10px;padding:13px;font-size:17px;font-weight:bold}h2{font-size:17px;margin-top:32px}.item{background:#171717;border:1px solid #333;border-radius:12px;padding:14px;margin:10px 0}.txt{white-space:pre-wrap;font-family:serif;font-size:18px;margin-bottom:11px}.a{display:flex;gap:8px}.a button{border:0;border-radius:8px;padding:10px;background:#333;color:white}.a .del{color:#ff8080}</style></head>
<body><main class="w"><h1>ルパン・タイトルメーカー</h1><div class="v">Version 1.1</div><textarea id="t" placeholder="タイトルを入力"></textarea><button class="make" id="m">作成・保存</button><h2>保存したタイトル</h2><div id="l"></div><p class="note">一覧はこの端末のSafariに保存されます。再生URLは相手に送れます。</p></main>
<script>
const KEY="lupin-title-list-v1",t=document.getElementById("t"),l=document.getElementById("l");
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}},save=x=>localStorage.setItem(KEY,JSON.stringify(x));
const url=x=>new URL("play.html?title="+encodeURIComponent(x),location.href).href;
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){let a=load();l.innerHTML=a.length?"":"まだありません。";a.forEach((x,i)=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="txt">${esc(x.title)}</div><div class="a"><button class="p">再生</button><button class="e">編集</button><button class="c">URLコピー</button><button class="del">削除</button></div>`;d.querySelector(".p").onclick=()=>location.href=url(x.title);d.querySelector(".e").onclick=()=>{t.value=x.title;a.splice(i,1);save(a);render();t.focus();window.scrollTo({top:0,behavior:"smooth"})};d.querySelector(".c").onclick=async()=>{await navigator.clipboard.writeText(url(x.title));alert("URLをコピーしました")};d.querySelector(".del").onclick=()=>{if(confirm("削除しますか？")){a.splice(i,1);save(a);render()}};l.appendChild(d)})}
m.onclick=()=>{let x=t.value.trim();if(!x)return alert("タイトルを入力してください");let a=load();a.unshift({title:x,created:Date.now()});save(a);render();location.href=url(x)};render();
</script></body></html>
